name: metuxa checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metuxa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build and test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y meson ninja-build g++ pkg-config
          libssl-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
          libpipewire-0.3-dev libsdbus-c++-dev libgtkmm-4.0-dev libjson-glib-dev
          openjdk-17-jdk-headless weston dbus-x11
      - name: Build and test
        run: |
          meson setup build -Dportal=enabled -Dmutter=disabled -Dbuildtype=debugoptimized
          meson compile -C build
          meson test -C build --print-errorlogs
      - name: Cross-language secure transport and input queue
        run: JAVA=/usr/lib/jvm/java-17-openjdk-amd64/bin/java JAVAC=/usr/lib/jvm/java-17-openjdk-amd64/bin/javac bash tests/security/run.sh
      - name: Isolated desktop UI regression tests
        run: bash client/gtk/tests/run-isolated-ui.sh "$PWD/build/client/gtk/metuxa-ui-tests"
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.7'
      - name: Core regressions, lint and unsigned release assembly
        working-directory: client/quest
        run: gradle --no-daemon testCore lintRelease assembleRelease
      - name: Native Android View layouts and interactions
        run: client/quest/tests/ui/run.sh --online
# Signing keys stay outside the repository. CI never publishes a release.

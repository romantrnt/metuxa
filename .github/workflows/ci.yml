name: metuxa checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: metuxa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build g++ pkg-config libssl-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libpipewire-0.3-dev libsdbus-c++-dev libgtkmm-4.0-dev libjson-glib-dev
      - name: Build and test
        run: |
          meson setup build -Dportal=enabled -Dmutter=disabled
          meson compile -C build
          meson test -C build --print-errorlogs
# No release, push, deployment or artifact-publication permission.
# Android signing and public distribution require a separate reviewed workflow.

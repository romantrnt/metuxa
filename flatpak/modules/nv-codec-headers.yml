# NVIDIA encoder headers compatible with FFmpeg 7.1 and the host RTX 2060.
# Header-only build dependency; the GPU driver remains supplied by Flatpak.
name: nv-codec-headers
buildsystem: simple
build-commands:
  - make PREFIX=/app install
sources:
  - type: git
    url: https://github.com/FFmpeg/nv-codec-headers.git
    tag: n12.2.72.0

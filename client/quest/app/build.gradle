plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metashare.client'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.romantrnt.metuxa'
        minSdk 32          // Quest 3 runtime
        targetSdk 34
        versionCode 7
        versionName '0.4.2'
        // Runtime version text is separate from the stable package/launcher label.
        resValue 'string', 'app_version', versionName
        resValue 'string', 'app_version_label', "metuxa v${versionName}"
    }

    // Pinned TLS signaling and authenticated encrypted media.
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ABI filter kept so the APK stays small; only arm64-v8a matters for Quest 3.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
}

dependencies {
    // No third-party media dependency: raw RTP is received with java.net and
    // decoded via the Android framework (MediaCodec H.265/H.264 + Opus,
    // AudioTrack, Surface).
}

// No downloaded test dependency is needed for the state machine, policy and privacy suite.
tasks.register('testCore', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'tests/run-core-tests.sh'
}
tasks.named('check').configure { dependsOn 'testCore' }
